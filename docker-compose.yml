services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: licita_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TZ: America/Bogota
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ backend ]

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: licita_pgadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: America/Bogota
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [ backend ]

  minio:
    image: minio/minio:latest
    container_name: licita_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ backend ]

  minio-init:
    image: minio/mc:latest
    container_name: licita_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&  mc mb -p local/${S3_BUCKET} || true && mc anonymous set download local/${S3_BUCKET} || true && exit 0 "
    restart: "no"
    networks: [ backend ]

  # ----------------------------------------------------------------------
  #  FLYWAY (NO LO NECESITAS AHORA)
  # ----------------------------------------------------------------------
  # flyway_init:
  #   image: flyway/flyway:10
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
  #     FLYWAY_USER: ${POSTGRES_USER}
  #     FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
  #     FLYWAY_CONNECT_RETRIES: 60
  #     FLYWAY_DEFAULT_SCHEMA: public
  #     TZ: America/Bogota
  #   command: -locations=filesystem:/flyway/sql migrate
  #   volumes:
  #     - ./Db/migrations:/flyway/sql:ro
  #   networks: [ backend ]

  app:
    build: .
    image: licita-backend
    container_name: licita_app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      TZ: America/Bogota
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    networks: [ backend ]

volumes:
  db_data:
  pgadmin_data:
  minio_data:


networks:
  backend:
    driver: bridge
